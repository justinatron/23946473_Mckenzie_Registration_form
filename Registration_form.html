<body>

   <h1 style="color: hotpink;"> Here is a Registration form</h1>

            </tr>
            <tr>

                <td><input type="text" name="City" id="City" required placeholder="City"></td>
            </tr>
            <tr>

		            <option value="MO">Missouri</option>
		            <option value="MT">Montana</option>
